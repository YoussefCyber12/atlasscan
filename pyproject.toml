[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasscan"
version = "0.2.0"
description = "Lightweight web vulnerability scanner with a CLI and a web dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AtlasScan Contributors" }]
keywords = ["security", "pentest", "scanner", "xss", "sqli", "recon", "bugbounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
atlasscan = "atlasscan.cli:main"

[project.urls]
Homepage = "https://github.com/YoussefCyber12/atlasscan"
Issues = "https://github.com/YoussefCyber12/atlasscan/issues"

[tool.setuptools.packages.find]
include = ["atlasscan*"]

[tool.setuptools.package-data]
atlasscan = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
