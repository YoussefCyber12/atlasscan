<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VulnScout{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --panel-2: #0f141b;
      --border: #1f2a37;
      --text: #d7e0ea;
      --muted: #8494a6;
      --accent: #35d0a5;
      --critical: #ff4d6d;
      --high: #ff8a3d;
      --medium: #ffd166;
      --low: #4cc9f0;
      --info: #8b9bb0;
      --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 80% -10%, #13202b 0%, var(--bg) 60%);
      color: var(--text);
      font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 20, .85); backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-weight: 700; letter-spacing: .3px; color: var(--text); font-size: 17px; }
    .brand span { color: var(--accent); }
    .topbar nav a { margin-left: 18px; color: var(--muted); font-size: 14px; }
    .topbar nav a:hover { color: var(--text); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.3px; }
    h2 { font-size: 18px; margin: 28px 0 12px; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); font-size: 13px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
    }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .stat .num { font-size: 26px; font-weight: 700; font-family: var(--mono); }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      border: 1px solid currentColor;
    }
    .badge.critical { color: var(--critical); background: rgba(255,77,109,.1); }
    .badge.high { color: var(--high); background: rgba(255,138,61,.1); }
    .badge.medium { color: var(--medium); background: rgba(255,209,102,.1); }
    .badge.low { color: var(--low); background: rgba(76,201,240,.1); }
    .badge.info { color: var(--info); background: rgba(139,155,176,.1); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
    tbody tr:hover { background: rgba(53,208,165,.04); }
    .finding { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--panel); }
    .finding summary {
      cursor: pointer; padding: 13px 16px; display: flex; gap: 12px; align-items: center;
      list-style: none;
    }
    .finding summary::-webkit-details-marker { display: none; }
    .finding .title { font-weight: 600; }
    .finding .body { padding: 0 16px 16px; border-top: 1px solid var(--border); }
    .finding .body p { margin: 12px 0; }
    pre {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px;
      white-space: pre-wrap; word-break: break-word; margin: 8px 0;
    }
    .meta { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; font-size: 13px; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; word-break: break-all; }
    input[type=text], input[type=url] {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); font-family: var(--mono);
    }
    input[type=text]:focus, input[type=url]:focus { outline: none; border-color: var(--accent); }
    button, .btn {
      background: var(--accent); color: #04120d; border: 0; border-radius: 8px;
      padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 14px;
    }
    button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .filters button {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 12px; font-weight: 600; font-size: 12px;
    }
    .filters button.active { color: var(--bg); background: var(--text); }
    .risk { font-family: var(--mono); font-size: 34px; font-weight: 700; }
    .risk.low { color: var(--accent); }
    .risk.mid { color: var(--medium); }
    .risk.high { color: var(--critical); }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 20px; border-top: 1px solid var(--border); }
    @media print {
      body { background: #fff; color: #111; }
      .topbar, footer, .filters, .no-print { display: none; }
      .card, .finding, pre, .stat { background: #fff; border-color: #ccc; }
      .finding { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Vuln<span>Scout</span></a>
    <nav>
      <a href="/">Scans</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer>VulnScout &middot; only scan systems you are authorized to test.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
